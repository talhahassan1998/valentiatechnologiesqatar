name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So the site can be republished without an empty commit.
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN is read-only for contents.
# Note: `administration` is NOT a valid workflow permission — adding it makes
# GitHub reject the whole workflow before any job starts, which is why
# configure-pages cannot create the Pages site itself here.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a run that is already
# publishing is allowed to finish rather than leaving the site half-swapped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` not `npm install`: it installs exactly what the lockfile
      # pins, so a CI build cannot silently pick up a newer transitive dep.
      - run: npm ci

      - run: npm run lint

      # `npm run build` runs `tsc -b` first, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - run: npm run build
        env:
          # Switches vite.config.ts to the /valentiatechnologiesqatar/ base.
          GITHUB_PAGES: 'true'

      # GitHub Pages serves static files with no rewrite rule, so a deep link
      # like /services asks for a file that does not exist. Serving index.html
      # as the 404 page hands those requests to the SPA router instead — the
      # Pages equivalent of vercel.json's rewrite and public/_redirects.
      - run: cp dist/index.html dist/404.html

      # No `enablement: true` here: it needs `administration: write`, which is
      # not a permission a workflow can grant itself. Pages must therefore be
      # turned on once in Settings -> Pages -> Source -> GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
