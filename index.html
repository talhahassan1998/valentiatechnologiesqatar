<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The V mark, not the full lockup: the wordmark is illegible at 16px.
         %BASE_URL% is substituted by Vite at build time -- a bare "/..." here
         404s under the GitHub Pages subdirectory, and unlike JSX this file
         cannot reach src/lib/asset.ts. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d1a" />
    <title>Valentia Technologies — Engineering Better Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint — React mounting later would flash the
      // dark ground at light-theme users. Mirrors readTheme() in lib/theme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('valentia-theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
